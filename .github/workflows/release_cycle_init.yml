name: Init Release Cycle

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Next development version (e.g., 3.0.0)'
        required: true
        type: string
      next_version:
        description: 'Next development version (e.g., 3.1.0)'
        required: true
        type: string
      openvino_version:
        description: 'Next OpenVINO version (e.g., 2026.1.0.rc1)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release_branch:
    name: "Release Branch"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
            ref: develop

      - name: Read current version
        id: read_version
        run: |
          set -x
          RELEASE_VERSION=$(grep '__version__' src/nncf/version.py | sed 's/.*"\([^"]*\)".*/\1/')
          echo "Current version: ${RELEASE_VERSION}"
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> "${GITHUB_ENV}"

      - name: Create release branch
        run: |
          set -x
          NO_DOT_VERSION=$(echo "${{ env.RELEASE_VERSION }}" | tr -d '.')
          RELEASE_BRANCH="release_v${NO_DOT_VERSION}"
          echo "RELEASE_BRANCH=${RELEASE_BRANCH}" >> "${GITHUB_ENV}"

          if git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "$RELEASE_BRANCH"; then
              echo "❌ Release branch $RELEASE_BRANCH already exists."
              exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"

      - name: Save release artifacts
        run: |
          set -x
          echo "RELEASE_BRANCH=${{ env.RELEASE_BRANCH }}" > release_artifacts.txt
          echo "RELEASE_VERSION=${{ env.RELEASE_VERSION }}" >> release_artifacts.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-info
          path: release_artifacts.txt

  bump_nncf_version:
    name: "Bump NNCF version"
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout develop branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
            ref: develop

      - name: Validate version format
        run: |
          set -x
          if ! [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Version must be in format X.Y.Z"
              exit 1
          fi

      - name: Create version bump branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
            set -x
            NEXT_VERSION="${{ github.event.inputs.next_version }}"
            BUMP_BRANCH="bump_nncf_version_to_${NEXT_VERSION}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            git checkout develop
            git checkout -b "${BUMP_BRANCH}"

            sed -i "s/__version__ = ['\"].*['\"]*/__version__ = \"${NEXT_VERSION}\"/" src/nncf/version.py

            git add src/nncf/version.py
            git commit -m "Bump version to ${NEXT_VERSION}"
            git push origin "${BUMP_BRANCH}"

            PR_TITLE="Bump NNCF version to ${NEXT_VERSION}"
            PR_BODY="### Changes

            Updated version in src/nncf/version.py to $NEXT_VERSION.

            ### Reason for changes

            Prepare NNCF for the next release cycle.
            "

            gh pr create \
                --base develop \
                --head "${BUMP_BRANCH}" \
                --title "${PR_TITLE}" \
                --body "${PR_BODY}"

  release_notes:
    name: "Release Notes"
    runs-on: ubuntu-latest
    needs: [release_branch]
    defaults:
      run:
        shell: bash
    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-info

    - name: Load release variables
      run: |
        set -x
        cat release_artifacts.txt >> "${GITHUB_ENV}"

    - name: Checkout develop branch
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
          ref: ${{ env.RELEASE_BRANCH }}

    - name: Create release notes
      run: |
        set -x
        git checkout -b release_notes

        NO_DOT_VERSION=$(echo "${{ env.RELEASE_VERSION }}" | tr -d '.')
        BRANCH_NAME="r${NO_DOT_VERSION}/release_notes"

        head -n 2 ReleaseNotes.md > tmp.md
        cat .github/scripts/release_notes_template.txt >> tmp.md
        sed -i "s/TBD_VERSION/${{ env.RELEASE_VERSION }}/g" tmp.md
        tail -n +2 ReleaseNotes.md >> tmp.md
        mv tmp.md ReleaseNotes.md

        git add ReleaseNotes.md
        git commit -m "Add release notes for v${{ env.RELEASE_VERSION }}"
        git push origin "${BRANCH_NAME}"

        PR_BODY="### Changes

        Add release notes for v${{ env.RELEASE_VERSION }}.

        ### Reason for changes

        Upcoming release ${{ env.RELEASE_VERSION }}

        ### Release Notes

        TBD
        "

        gh pr create \
          --base ${{ env.RELEASE_BRANCH }} \
          --head "${BRANCH_NAME}" \
          --title "Release notes for v${{ env.RELEASE_VERSION }}" \
          --body "${PR_BODY}"
